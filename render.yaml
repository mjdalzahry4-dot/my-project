services:
  - type: web
    name: my-project
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python backend/manage.py migrate --noinput && python -m gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:${PORT:-10000}
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: my-project
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_SSLMODE
        value: verify-full
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "false"
      - key: DJANGO_LOG_LEVEL
        value: INFO
